<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Apuntes de teoría</title>
  <meta
    name="description"
    content="Acceso a los apuntes de Administración de Sistemas y Redes de Computadores."
  />

  <style>
    :root {
      color-scheme: dark;
      --background: #09090b;
      --surface: #18181b;
      --surface-hover: #27272a;
      --border: #3f3f46;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #8b5cf6;
      --accent-secondary: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(99, 102, 241, 0.18), transparent 35%),
        var(--background);
    }

    main {
      width: min(900px, 100%);
    }

    .header {
      margin-bottom: 40px;
      text-align: center;
    }

    .header span {
      display: inline-block;
      margin-bottom: 14px;
      color: #c4b5fd;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 12px;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .header p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .subjects {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .subject-card {
      position: relative;
      display: flex;
      min-height: 230px;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 28px;
      color: inherit;
      text-decoration: none;
      background: rgba(24, 24, 27, 0.88);
      border: 1px solid var(--border);
      border-radius: 22px;
      backdrop-filter: blur(12px);
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background-color 180ms ease;
    }

    .subject-card::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -60px;
      bottom: -70px;
      border-radius: 999px;
      background: var(--card-glow);
      filter: blur(18px);
      opacity: 0.35;
      transition: opacity 180ms ease;
    }

    .subject-card:hover {
      transform: translateY(-5px);
      background: var(--surface-hover);
      border-color: var(--card-accent);
    }

    .subject-card:hover::after {
      opacity: 0.6;
    }

    .subject-card:focus-visible {
      outline: 3px solid var(--card-accent);
      outline-offset: 4px;
    }

    .icon {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      font-size: 1.6rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 15px;
    }

    .subject-card h2 {
      margin-top: 36px;
      margin-bottom: 8px;
      font-size: 1.45rem;
      letter-spacing: -0.02em;
    }

    .subject-card p {
      max-width: 32ch;
      color: var(--muted);
      line-height: 1.55;
    }

    .arrow {
      position: absolute;
      top: 28px;
      right: 28px;
      color: var(--muted);
      font-size: 1.4rem;
      transition:
        transform 180ms ease,
        color 180ms ease;
    }

    .subject-card:hover .arrow {
      color: var(--text);
      transform: translate(4px, -4px);
    }

    .systems {
      --card-accent: #8b5cf6;
      --card-glow: #8b5cf6;
    }

    .networks {
      --card-accent: #22d3ee;
      --card-glow: #22d3ee;
    }

    footer {
      margin-top: 32px;
      color: #71717a;
      text-align: center;
      font-size: 0.9rem;
    }

    @media (max-width: 650px) {
      .subjects {
        grid-template-columns: 1fr;
      }

      .subject-card {
        min-height: 200px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="header">
      <span>Teoría</span>
      <h1>Selecciona una asignatura</h1>
      <p>Elige el contenido que quieres consultar.</p>
    </header>

    <section class="subjects" aria-label="Asignaturas">
      <a
        class="subject-card systems"
        href="./adsis.html"
        aria-label="Abrir teoría de Administración de Sistemas"
      >
        <div>
          <div class="icon" aria-hidden="true">🖥️</div>
          <h2>Administración de Sistemas</h2>
          <p>Accede a los apuntes y contenidos de Administración de Sistemas.</p>
        </div>

        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a
        class="subject-card networks"
        href="./redes.html"
        aria-label="Abrir teoría de Redes de Computadores"
      >
        <div>
          <div class="icon" aria-hidden="true">🌐</div>
          <h2>Redes de Computadores</h2>
          <p>Accede a los apuntes y contenidos de Redes de Computadores.</p>
        </div>

        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </section>

    <footer>
      Apuntes de teoría
    </footer>
  </main>
</body>
</html>
